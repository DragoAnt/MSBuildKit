name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    name: Publish the kit zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate the tag
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          version="${version#V}"
          if ! printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::Release tag '$tag' is not a SemVer 2.0 version (for example v1.2.0 or v1.2.0-beta.1)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Self-test the kit
        run: sh tests/run.sh

      - name: Pack the kit
        run: sh tools/pack-kit.sh "${{ steps.version.outputs.version }}" dist/release

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp kit/.toolkit/update.sh kit/.toolkit/update.ps1 dist/release/
          gh release upload "${GITHUB_REF_NAME}" dist/release/* --clobber
